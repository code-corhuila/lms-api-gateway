# lms-api-gateway — single entry point: serves the shell's static SPA,
# routes /api/v1/* by path prefix to the owning service, and implements
# ADR-007's two decisions:
#
#   1. A cheap, stateless check that a protected route's request carries an
#      Authorization header at all (fast 401, no JWT parsing). Real
#      validation always stays inside each service (ADR-003, ADR-007) — this
#      gateway never parses or verifies a token itself.
#   2. Real rate limiting: a tight zone for login, a wider one for the rest
#      of the API.
#
# No trailing slash on `location` and no URI part on `proxy_pass` — forwards
# the original request URI to the upstream byte-for-byte, so it matches each
# service's own router regardless of what sub-path follows (same convention
# as lms-library's original infra/nginx/nginx.conf, migrated here).

limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

server {
    listen 80;
    server_name _;

    limit_req_status 429;

    # --- Login: public (no Authorization header to check yet), its own
    # tighter rate-limit zone (ADR-007's table: 5 req/min/IP, burst 2) ---
    location = /api/v1/auth/login {
        limit_req zone=login burst=2 nodelay;
        add_header Retry-After 60 always;
        proxy_pass http://access-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- Every other protected route: reject with no Authorization header
    # at all before it ever reaches a backend (ADR-007's "cheap,
    # stateless pass-through check"), plus the wider rate-limit zone
    # (60 req/min/IP, burst 20) ---
    location /api/v1/students {
        limit_req zone=api burst=20 nodelay;
        add_header Retry-After 60 always;
        if ($http_authorization = "") { return 401; }
        proxy_pass http://membership-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/books {
        limit_req zone=api burst=20 nodelay;
        add_header Retry-After 60 always;
        if ($http_authorization = "") { return 401; }
        proxy_pass http://catalog-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/loans {
        limit_req zone=api burst=20 nodelay;
        add_header Retry-After 60 always;
        if ($http_authorization = "") { return 401; }
        proxy_pass http://circulation-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- The gateway's own liveness — does not depend on any backend ---
    location = /health {
        add_header Content-Type application/json always;
        return 200 '{"status":"ok"}';
    }

    # --- Everything else: the shell's own static SPA, fronted here so the
    # browser only ever talks to one origin. lms-front's own container
    # (`shell`) still builds/serves its bundle; this just proxies to it. ---
    location / {
        proxy_pass http://shell:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
